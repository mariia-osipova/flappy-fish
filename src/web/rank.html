    <script>
      // Global error shield to prevent third-party extensions (e.g. MetaMask, Web3 wallet injection) from breaking the page
      window.addEventListener("error", function (e) {
        if (e && (e.message?.includes("MetaMask") || e.message?.includes("ethereum") || e.filename?.includes("extension"))) {
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener("unhandledrejection", function (e) {
        const reason = e && (e.reason?.message || String(e.reason || ""));
        if (reason.includes("MetaMask") || reason.includes("ethereum") || reason.includes("User rejected")) {
          e.preventDefault();
          return true;
        }
      });
    </script>
