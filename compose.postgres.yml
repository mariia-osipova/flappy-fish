services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: flappy_fish_test
      POSTGRES_USER: flappy_fish
      POSTGRES_PASSWORD: flappy_fish_test
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flappy_fish -d flappy_fish_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
